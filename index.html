<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>4 Timers</title>
<style>
  :root{
    --bg:#10141a; --card:#1a212b; --text:#e8edf3; --muted:#8a97a8;
    --accent:#2e9cff; --ok:#2ecc71; --warn:#f5a623; --bad:#ff4d4d; --line:#2a3340; --field:#0f141b;
  }
  :root[data-theme=light]{
    --bg:#eef1f5; --card:#ffffff; --text:#14202e; --muted:#5b6878;
    --accent:#0b78e0; --ok:#1f9d55; --warn:#d98200; --bad:#d93636; --line:#c5ced9; --field:#f4f6f9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    height:var(--vvh,100dvh);padding:8px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
    padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}

  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
  .head .lbl{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .head .now{font-size:clamp(24px,5vh,38px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
  .wl{font-size:11px;color:var(--muted)}
  .wl.on{color:var(--ok)} .wl.off{color:var(--warn)}
  .fs{flex:none;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:#fff;background:#3a4556;cursor:pointer}

  .hbtns{display:flex;gap:6px;flex:none}
  .fs.danger{background:var(--bad)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:320px;width:100%;text-align:center}
  .modal .box p{margin:0 0 6px;font-size:18px;font-weight:700}
  .modal .box small{display:block;color:var(--muted);margin-bottom:14px;font-size:13px}
  .modal .row{display:flex;gap:8px}
  .modal .row button{flex:1;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:700;color:#fff;cursor:pointer}
  #timers{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(min-content,1fr));gap:6px;overflow-y:auto}
  .timer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;min-height:min-content;
    display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"top top" "time info" "btns btns" "note note";
    align-items:center;row-gap:3px;column-gap:12px}
  .timer.running{border-color:var(--accent)}
  .timer.warn{border-color:var(--warn);animation:glow 1s ease-in-out infinite}
  @keyframes glow{
    0%,100%{background:var(--card);box-shadow:0 0 0 0 rgba(245,166,35,0)}
    50%{background:#f5a623;box-shadow:0 0 28px 6px rgba(245,166,35,.8)}
  }
  .timer.warn.lit .time,.timer.warn.lit .info b,.timer.warn.lit .info,.timer.warn.lit .num{color:#fff}
  .timer.over{border-color:var(--bad)}

  .top{grid-area:top;display:flex;gap:8px;align-items:center;min-width:0}
  .dbl{font-size:17px;font-weight:700;letter-spacing:.04em}
  .num{width:64px;margin-right:auto;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px;text-align:center;padding:2px;min-width:0}
  .num::placeholder{color:var(--muted);opacity:.6}
  .tag{width:84px;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px;text-align:center;padding:2px;min-width:0;margin-right:auto}
  .tag::placeholder{color:var(--muted);opacity:.6}
  .num{margin-right:0 !important}
  .note{grid-area:note;width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;line-height:1.25;padding:2px 8px;min-width:0;font-family:inherit;resize:none;display:block;overflow:hidden;max-height:5.5em}
  .note::placeholder{color:var(--muted);opacity:.6}
  .set{display:flex;align-items:center;gap:3px;color:var(--muted)}
  .set input{width:46px;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:15px;text-align:center;padding:2px}

  .time{grid-area:time;font-size:clamp(28px,6.5vh,52px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;background:transparent;border:0;padding:0;margin:0;color:var(--text);font-family:inherit;width:5.2ch;min-width:0;outline:none;border-radius:8px}
  .time:not([readonly]){text-decoration:underline dotted var(--muted);text-underline-offset:6px}
  .time:not([readonly]):focus{background:var(--field);box-shadow:0 0 0 2px var(--accent);text-decoration:none}
  .running .time{color:var(--accent)}
  .warn .time{color:var(--warn)}
  .timer.warn .time{animation:txt 1s ease-in-out infinite}
  @keyframes txt{0%,100%{color:var(--warn)}50%{color:#10141a}}
  .over .time{color:var(--bad)}

  .info{grid-area:info;display:flex;flex-direction:column;align-items:flex-end;color:var(--muted);font-size:12px;line-height:1.2;font-variant-numeric:tabular-nums;min-width:0;gap:2px}
  .info div{white-space:nowrap}
  .info b{color:var(--text);font-weight:600}
  .info .plan{color:var(--muted);font-weight:400}
  .info .live{color:var(--bad);font-weight:600}
  .info .empty{opacity:.55}
  .info .row{display:flex;align-items:center;gap:2px;white-space:nowrap;width:100%}
  .info .n{width:8px;text-align:right}
  .tin{flex:1 1 0;width:0;text-align:center;background:var(--field);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:13px;line-height:1.15;
       padding:1px 3px;font-family:inherit;font-variant-numeric:tabular-nums;color-scheme:dark;min-width:0}
  .tin:disabled{opacity:.45}
  .tin.live{color:var(--bad);font-weight:600}
  .tin::-webkit-calendar-picker-indicator{display:none}
  .tin{-webkit-appearance:none;appearance:none;padding:1px 2px;overflow:hidden}
  .tin::-webkit-datetime-edit,.tin::-webkit-datetime-edit-fields-wrapper{padding:0}
  .tin::-webkit-date-and-time-value{text-align:center;min-width:0;margin:0}

  .btns{grid-area:btns;display:flex;gap:6px}
  button.b{flex:1;border:none;border-radius:8px;padding:clamp(5px,1.1vh,9px) 4px;font-size:15px;font-weight:600;color:#fff;cursor:pointer}
  button.b:disabled{opacity:.35;cursor:default}
  .start{background:var(--ok)} .stop{background:var(--bad)} .reset{background:#3a4556;flex:.6}
  button:active:not(:disabled){opacity:.7}

  /* Liggend / laag scherm: alles van een timer op één regel */
  @media (orientation:landscape) and (max-height:620px){
    #timers.c1 .timer{grid-template-columns:minmax(0,1.1fr) auto minmax(0,1fr) minmax(0,1.2fr);
      grid-template-areas:"top time info btns" "note note note note";column-gap:12px;row-gap:4px}
    #timers.c1 .top{flex-direction:column;align-items:stretch;gap:4px}
    #timers.c1 .time{font-size:clamp(26px,10vh,56px)}
    #timers.c1 .info{align-items:flex-start}
  }

  .projin{flex:1;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:16px;padding:6px 10px;text-transform:none;letter-spacing:0}
  .cnt{flex:none;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .cbtns{display:flex;gap:6px}
  .cbtns button{width:42px;padding:6px 0;border:none;border-radius:8px;font-size:15px;font-weight:700;color:#fff;background:#3a4556;cursor:pointer}
  .cbtns button.on{background:var(--accent)}
  .cbtns button:disabled{opacity:.35;cursor:default}
  .timer.hid{display:none}

  /* Smalle blokken (telefoon rechtop, 2 naast elkaar): alles onder elkaar */
  @media (max-width:600px){
    #timers:not(.c1) .timer{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "time" "info" "btns" "note";row-gap:4px;padding:5px 7px 6px}
    #timers:not(.c1) .top{flex-wrap:wrap;gap:4px 6px}
    #timers:not(.c1) .num{width:50px}
    #timers:not(.c1) .tag{flex:1;width:auto;min-width:48px;margin-right:0}
    #timers:not(.c1) .set{width:100%;justify-content:center}
    #timers:not(.c1) .time{width:100%;text-align:center;font-size:clamp(28px,5.5vh,44px)}
    #timers:not(.c1) .info{align-items:center}
    #timers:not(.c1) .tin{font-size:12px}
    #timers:not(.c1) button.b{font-size:13px}
  }

  .dbtn{flex:none;border:none;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;color:#fff;background:#3a4556;cursor:pointer}
  .dbtn.filled{background:var(--ok)}
  .xbtn{flex:none;border:none;border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer}
  .dm{position:fixed;top:0;left:0;right:0;height:var(--vvh,100%);background:var(--bg);z-index:60;display:none;flex-direction:column}
  .dm.show{display:flex}
  .dmh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
  .dmh b{font-size:18px}
  .dmh button{border:none;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer}
  #dbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
  .fld{margin-bottom:16px}
  .fld>label{display:block;font-size:17px;margin-bottom:2px}
  .rq{color:var(--bad)}
  .hint{color:var(--muted);font-size:14px;line-height:1.35;white-space:pre-line;margin-bottom:6px}
  .fld input[type=text],.fld textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:18px;padding:10px;font-family:inherit}
  .fld textarea{resize:vertical}
  .nb{display:flex;gap:8px;margin-top:6px}
  .nb button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:20px;font-weight:700;color:#fff;background:#0b8bc4;cursor:pointer}
  .hbtns{flex:0 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
  .head>div:first-child{flex:none}
  @media (max-width:600px){.fs{padding:7px 9px;font-size:12px}.hbtns{gap:4px}}
  html,body{max-width:100vw;overflow-x:hidden}
  #ovbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 40px}
  .ovc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .ovt{font-size:19px;font-weight:700;margin-bottom:6px}
  .ovs{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px}
  .ovr{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:2px 0;border-bottom:1px solid var(--line)}
  .ovr span:first-child{color:var(--muted)}
  .ovr span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:pre-wrap}
  .tp{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:17px}
  .tp input{width:22px;height:22px}
  .hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4);transition:width 0s}
  .hold.on .fill{width:100%;transition:width 1.5s linear}
  .hold .t{position:relative}
  button.reset{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button.reset::after{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,196,0,.75);transition:width 0s;pointer-events:none}
  button.reset.on::after{width:100%;transition:width 1.2s linear}
  button.reset.armed{color:#fff;box-shadow:0 0 0 2px #ffc400 inset}
  .fld input.miss,.fld textarea.miss,.projin.miss{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
  .fld.missbox{outline:2px solid var(--bad);border-radius:10px;padding:6px}
  .delarch{margin-top:8px;width:100%;border:none;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;color:#fff;background:#3a4556;cursor:pointer}
</style>
</head>
<body>
<div class="head">
  <div>
    <div class="lbl">Huidige tijd</div>
    <div class="now" id="now">--:--</div>
    <div class="wl" id="wl">Scherm aan blijven: starten…</div>
  </div>
  <div class="hbtns">
    <button class="fs" id="theme" type="button" aria-label="Dag/nacht">☀️</button>
    <button class="fs" id="fs" type="button">Volledig</button>
    <button class="fs" id="ov" type="button">Overzicht</button>
    <button class="fs danger" id="resetAll" type="button">Reset alles</button>
    <button class="fs" id="undo" type="button" style="display:none;background:var(--ok)">Herstel reset</button>
    
  </div>
</div>
<div class="cnt"><span>Aantal timers</span><div class="cbtns" id="cbtns"></div></div>
<div class="cnt"><span>Project <span class="rq">*</span></span><input id="proj" class="projin" type="text" placeholder="projectnr" maxlength="20" autocomplete="off"></div>
<div class="modal" id="modal">
  <div class="box">
    <p>Alles resetten?</p>
    <small id="rsInfo">Alle timers worden gestopt en alle tijden, nummers en opmerkingen worden gewist.</small>
    <div class="row">
      <button type="button" id="rsNo" style="background:#3a4556">Annuleer</button>
      <button type="button" id="rsYes" class="hold" style="background:var(--bad)"><span class="fill"></span><span class="t">Houd ingedrukt</span></button>
    </div>
  </div>
</div>
<div class="dm" id="ovmodal">
  <div class="dmh"><b>Overzicht</b><span><button type="button" id="ovcopy" style="background:#3a4556;margin-right:6px">Screenshot</button><button type="button" id="ovclose">Sluiten</button></span></div>
  <div id="ovbody"></div>
</div>
<div class="dm" id="dmodal">
  <div class="dmh"><b id="dtitle">Gegevens</b><button type="button" id="dclose">Klaar</button></div>
  <div id="dbody"></div>
</div>
<div id="timers"></div>

<script>
const N = 4, MAXRUNS = 3, WARN_MS = 60000, KEY = 'vier-timers-v2';
const pad = n => String(n).padStart(2,'0');
const fmtClock = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
// Negatieve tijd wordt met een min-teken getoond (loopt door na 00:00)
const fmtLeft = ms => {
  const s = Math.ceil(ms/1000), a = Math.abs(s);
  return (s < 0 ? '-' : '') + pad(Math.floor(a/60)) + ':' + pad(a%60);
};

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if (!Array.isArray(state) || state.length !== N) {
  state = Array.from({length:N}, (_,i)=>({num:'', dur:900, runs:[]}));
}
state.forEach(t=>{ if (typeof t.num !== 'string') t.num = ''; if (typeof t.tag !== 'string') t.tag = ''; if (typeof t.note !== 'string') t.note = ''; if (!t.data || typeof t.data !== 'object') t.data = {}; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
const hasData = t => !!(t.num || t.tag || t.note || Object.keys(t.data).length);
const activeRun = t => { const r = t.runs[t.runs.length-1]; return r && r.end == null ? r : null; };

const toInput = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fromInput = (v, refTs) => {
  const m = /^(\d{1,2}):(\d{2})/.exec(v||''); if (!m) return null;
  const d = new Date(refTs); d.setHours(+m[1], +m[2], 0, 0); return d.getTime();
};
// Begin- of eindtijd handmatig aanpassen
function editTime(t, k, which, val){
  const r = t.runs[k];
  if (!r) { render(); return; }
  const ref = r.start;
  let ts = fromInput(val, ref);
  if (ts == null) { render(); return; }
  const active = r.end == null;
  if (which === 'start') {
    r.start = ts;
    if (active) r.plan = ts + t.dur*1000;
  } else {
    if (ts < r.start) ts += 86400000;          // over middernacht
    if (active) r.plan = ts; else r.end = ts;
  }
  if (active) {                                 // alarmen opnieuw beoordelen
    const left = r.plan - Date.now();
    r.warned = left <= WARN_MS;
    r.zeroed = left <= 0;
  }
  save(); render();
}

let count = 4;
try { const c = parseInt(localStorage.getItem(KEY+'-n')); if (c >= 1 && c <= 4) count = c; } catch(e){}
const host = document.getElementById('timers');
const els = state.map((t,i) => {
  const div = document.createElement('div');
  div.className = 'timer';
  div.innerHTML = `
    <div class="top">
      <span class="dbl">DB</span><input class="num" type="text" inputmode="numeric" maxlength="6" placeholder="nr" aria-label="Nummer"><input class="tag" type="text" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="divernr" aria-label="Letters en nummers"><button type="button" class="dbtn">Gegevens</button><button type="button" class="xbtn">Export</button>
    </div>
    <input class="time" type="text" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Tijd (mm:ss)" value="15:00">
    <div class="info"></div>
    <div class="btns">
      <button class="b start">Start</button>
      <button class="b reset">Wis</button>
      <button class="b stop">Stop</button>
    </div>
    <textarea class="note" rows="1" maxlength="300" autocomplete="off" placeholder="Opmerking…" aria-label="Opmerking"></textarea>`;
  host.appendChild(div);
  const q = s => div.querySelector(s);
  const e = {div, dbtn:q('.dbtn'), xbtn:q('.xbtn'), num:q('.num'), tag:q('.tag'), note:q('.note'), time:q('.time'),
             rows:[], start:q('.start'), stop:q('.stop'), reset:q('.reset')};
  const info = q('.info');
  for (let k=0; k<MAXRUNS; k++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="n">'+(k+1)+'</span><input class="tin s" type="time" step="60" aria-label="Starttijd"><span>→</span><input class="tin en" type="time" step="60" aria-label="Eindtijd">';
    info.appendChild(row);
    const si = row.querySelector('.s'), ei = row.querySelector('.en');
    e.rows.push({si, ei});
    si.addEventListener('change', () => editTime(t, k, 'start', si.value));
    ei.addEventListener('change', () => editTime(t, k, 'end', ei.value));
  }
  e.num.value = t.num;
  e.dbtn.addEventListener('click', () => openData(i));
  e.xbtn.addEventListener('click', () => exportTimer(i, e.xbtn));

  e.tag.value = t.tag; e.note.value = t.note;
  e.num.addEventListener('input', () => { t.num = e.num.value; save(); });
  e.tag.addEventListener('input', () => { t.tag = e.tag.value; save(); });
  const grow = () => { e.note.style.height = 'auto'; e.note.style.height = Math.min(e.note.scrollHeight + 2, e.note.scrollHeight > 0 ? 9999 : 0) + 'px'; };
  e.grow = grow;
  e.note.addEventListener('input', () => { t.note = e.note.value; save(); grow(); });
  const parseDur = v => {
    v = (v||'').trim();
    let m, sec;
    if (v.includes(':')) { const p = v.split(':'); m = parseInt(p[0])||0; sec = parseInt(p[1])||0; }
    else { const d = v.replace(/\D/g,''); if (d.length <= 2) { m = parseInt(d)||0; sec = 0; } else { m = parseInt(d.slice(0,-2))||0; sec = parseInt(d.slice(-2))||0; } }
    return Math.min(999*60+59, Math.max(0, m*60 + Math.min(59, sec)));
  };
  const setDur = () => {
    if (activeRun(t)) return;
    t.dur = parseDur(e.time.value);
    save(); render();
  };
  e.time.addEventListener('focus', () => { if (!activeRun(t)) setTimeout(() => e.time.select(), 0); });
  e.time.addEventListener('change', setDur);
  e.time.addEventListener('blur', () => { if (!activeRun(t)) { t.dur = parseDur(e.time.value); save(); } render(); });
  e.time.addEventListener('keydown', ev => { if (ev.key === 'Enter') e.time.blur(); });

  e.start.addEventListener('click', () => {
    if (activeRun(t) || t.runs.length >= MAXRUNS) return;
    const now = Date.now();
    t.runs.push({start:now, plan:now + t.dur*1000, end:null, warned: t.dur*1000 <= WARN_MS});
    unlockAudio(); askNotify(); save(); render();
  });
  e.stop.addEventListener('click', () => {
    const r = activeRun(t);
    if (!r) return;
    r.end = Date.now();
    save(); render();
  });

});

// Browsers staan geluid pas toe na een tik: bij Start spelen we kort stil af om het te ontgrendelen
let unlocked = false;
function unlockAudio(){
  if (unlocked) return;
  unlocked = true;
  [alarm, alarmZero].forEach(a => {
    a.muted = true;
    const done = () => { a.pause(); a.currentTime = 0; a.muted = false; };
    const p = a.play();
    if (p && p.then) p.then(done).catch(()=>{ a.muted = false; unlocked = false; }); else done();
  });
}
function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){} }
function notify(i, txt){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const t = state[i], name = 'DB ' + (t.num || (i+1)) + (t.tag ? ' ' + t.tag : '');
    const n = new Notification(name, {body: txt + (t.note ? ' – ' + t.note : ''), tag: 'timer-'+i, requireInteraction: true, silent: true});
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e){}
}
// Eindalarm: altijd helemaal afspelen. Niet afbreken door een ander alarm of een melding;
// komen er twee timers tegelijk op 0, dan speelt het geluid na elkaar (wachtrij).
let zeroPlaying = false, zeroQueue = 0, zeroGuard = null;
function playZero(){
  if (zeroPlaying) { zeroQueue++; return; }
  zeroPlaying = true;
  clearTimeout(zeroGuard); zeroGuard = setTimeout(() => { zeroPlaying = false; }, 6000);
  try { alarm.pause(); alarmZero.muted = false; alarmZero.currentTime = 0; alarmZero.play().catch(() => { zeroPlaying = false; }); } catch(e){ zeroPlaying = false; }
}
alarmZero.addEventListener('ended', () => { zeroPlaying = false; clearTimeout(zeroGuard); if (zeroQueue > 0) { zeroQueue--; playZero(); } });
alarmZero.addEventListener('pause', () => {      // onderbroken door het systeem? meteen verder
  if (zeroPlaying && !alarmZero.ended && isFinite(alarmZero.duration) && alarmZero.currentTime < alarmZero.duration - 0.05)
    setTimeout(() => { if (zeroPlaying) alarmZero.play().catch(()=>{}); }, 30);
});
function beepZero(i){
  playZero();
  setTimeout(() => notify(i, 'Tijd is om (00:00)'), 2400);   // melding pas na het geluid, zodat het niet stoort
  if (navigator.vibrate) navigator.vibrate([800,200,800]);
}
function beep(i){
  notify(i, 'Nog 1 minuut');
  if (zeroPlaying) { if (navigator.vibrate) navigator.vibrate([400,200,400]); return; }
  try { alarm.muted = false; alarm.currentTime = 0; alarm.play().catch(()=>{}); } catch(e){}
  if (navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
}

function render(){
  const now = Date.now();
  document.getElementById('now').textContent = fmtClock(now);
  state.forEach((t,i) => {
    const e = els[i], act = activeRun(t);
    const left = act ? act.plan - now : t.dur*1000;

    // Eén alarm, 1 minuut voor het einde
    if (act && !act.warned) {
      if (left > 0 && left <= WARN_MS) { act.warned = true; save(); beep(i); }
      else if (left <= 0) { act.warned = true; save(); }
    }

    // Tweede alarm: precies bij 00:00 (niet opnieuw afspelen als de pagina later pas opent)
    if (act && !act.zeroed && left <= 0) {
      act.zeroed = true; save();
      if (left > -10000) beepZero(i);
    }

    e.time.readOnly = !!act;
    if (document.activeElement !== e.time) e.time.value = fmtLeft(left);
    e.dbtn.classList.toggle('filled', !!t.data.type);
    e.div.classList.toggle('running', !!act);
    e.div.classList.toggle('warn', !!act && left > 0 && left <= WARN_MS);
    e.div.classList.toggle('over', !!act && left <= 0);

    for (let k=0; k<MAXRUNS; k++) {
      const r = t.runs[k], {si, ei} = e.rows[k];
      const setVal = (inp, v) => { if (document.activeElement !== inp && inp.value !== v) inp.value = v; };
      si.disabled = ei.disabled = !r;
      ei.classList.remove('live');
      if (!r) { setVal(si, ''); setVal(ei, ''); continue; }
      setVal(si, toInput(r.start));
      if (r.end != null) setVal(ei, toInput(r.end));
      else if (r.plan - now > 0) setVal(ei, toInput(r.plan));
      else { setVal(ei, toInput(now)); ei.classList.add('live'); ei.disabled = true; } // loopt door tot Stop
    }

    const full = t.runs.length >= MAXRUNS && !act;
    e.start.disabled = !!act || full;
    e.start.textContent = full ? 'Klaar 3/3' : 'Start ' + (t.runs.length + (act ? 0 : 1)) + '/' + MAXRUNS;
    e.stop.disabled = !act;
  });
  const mr = maxRunning(); cb.forEach((b,i) => { b.disabled = (i+1) < mr; });
  keepAlive(state.some(t=>activeRun(t)));
  document.title = (state.some(t=>activeRun(t)) ? '▶ ' : '') + '4 Timers';
}

// Scherm aan houden zolang de pagina zichtbaar is
let wakeLock = null;
const wlEl = document.getElementById('wl');
async function keepAwake(){
  if (!('wakeLock' in navigator)) {
    wlEl.textContent = 'Scherm aan houden niet ondersteund in deze browser';
    wlEl.className = 'wl off';
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wlEl.textContent = 'Scherm blijft aan';
    wlEl.className = 'wl on';
    wakeLock.addEventListener('release', () => {
      wlEl.textContent = 'Scherm aan: gepauzeerd (tik om te herstellen)';
      wlEl.className = 'wl off';
    });
  } catch (err) {
    wlEl.textContent = 'Scherm aan houden mislukt (tik om opnieuw te proberen)';
    wlEl.className = 'wl off';
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('click', unlockAudio);
document.addEventListener('click', () => { if (!wakeLock || wakeLock.released) keepAwake(); });
keepAwake();

// Volledig scherm: blijft gewenst tot je zelf op de knop drukt; een tik herstelt het
let wantFs = true;   // standaard volledig scherm bij openen; alleen uit als je zelf op de knop drukt
try { if (sessionStorage.getItem('fs') === '0') wantFs = false; } catch(e){}
const setWant = v => { wantFs = v; try { sessionStorage.setItem('fs', v ? '1' : '0'); } catch(e){} };
const enterFs = () => { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{}); };
document.getElementById('fs').addEventListener('click', (ev) => {
  ev.stopPropagation();
  if (document.fullscreenElement) { setWant(false); document.exitFullscreen(); }
  else { setWant(true); enterFs(); }
});
['click','touchend','keydown'].forEach(ev => document.addEventListener(ev, () => { if (wantFs) enterFs(); }, {passive:true}));
if (wantFs) enterFs();   // lukt alleen waar de browser het zonder tik toestaat; anders bij de eerste tik
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fs').textContent = document.fullscreenElement ? 'Verklein' : 'Volledig';
});

// Achtergrond: stille geluidsloop houdt de pagina actief (ook bij vergrendeld scherm / andere app)
function makeSilence(){
  const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, str) => { for (let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for (let i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
const keep = new Audio(makeSilence());
keep.loop = true;
let keepOn = false;
function keepAlive(on){
  if (on === keepOn && (!on || !keep.paused)) return;
  keepOn = on;
  if (on) {
    keep.play().catch(()=>{});
    try {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({title:'Timers lopen', artist:'4 Timers'});
        navigator.mediaSession.playbackState = 'playing';
      }
    } catch(e){}
  } else {
    keep.pause();
    try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none'; } catch(e){}
  }
}
// Tikker in een Web Worker wordt minder afgeremd dan setInterval in een achtergrond-tab
try {
  const wk = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},250)'], {type:'text/javascript'})));
  wk.onmessage = render;
} catch(e) { setInterval(render, 250); }
setInterval(render, 1000);
render();
const growAll = () => els.forEach(e => e.grow());
growAll();
window.addEventListener('resize', growAll);
window.addEventListener('orientationchange', () => setTimeout(growAll, 200));

// ===== Toetsenbord: scherm krimpt mee en het veld waar je in typt scrolt in beeld =====
(function(){
  const vv = window.visualViewport;
  const fit = () => {
    if (vv) document.documentElement.style.setProperty('--vvh', vv.height + 'px');
    window.scrollTo(0, 0);
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.scrollIntoView({block:'center'});
  };
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', () => window.scrollTo(0,0)); fit(); }
  document.addEventListener('focusin', ev => {
    const a = ev.target;
    if (!/^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
    [150, 400].forEach(ms => setTimeout(() => { if (document.activeElement === a) a.scrollIntoView({block:'center', behavior:'smooth'}); }, ms));
  });
})();

// ---- Dag / nacht ----
(function(){
  const btn = document.getElementById('theme');
  const meta = document.querySelector('meta[name="theme-color"]');
  function apply(m){
    document.documentElement.setAttribute('data-theme', m);
    btn.textContent = m === 'light' ? '🌙' : '☀️';
    btn.title = m === 'light' ? 'Nachtstand' : 'Dagstand';
    if (meta) meta.setAttribute('content', m === 'light' ? '#eef1f5' : '#10141a');
  }
  let m = 'dark';
  try { m = localStorage.getItem('vier-timers-theme') || 'dark'; } catch(e){}
  apply(m);
  btn.addEventListener('click', () => {
    m = m === 'light' ? 'dark' : 'light';
    apply(m);
    try { localStorage.setItem('vier-timers-theme', m); } catch(e){}
  });
})();

    navigator.serviceWorker.register('sw.js').catch(() => {});
